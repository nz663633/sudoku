<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docugment</title>
    <style>
        table,
        tr,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        td input {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 20px;
        }

        tr:nth-child(3n+1) {
            border-top: 2px solid black;
        }

        td:nth-child(3n+1) {
            border-left: 2px solid black;
        }

        tr:last-child {
            border-bottom: 2px solid black;
        }

        td:last-child {
            border-right: 2px solid black;
        }

        .chart {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .sentence1 {
            margin-top: 15px;
            margin-bottom: 20px;
            margin-left: 20px;
            align-items: center;
        }

        .sentence2 {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 20px;
            margin-left: 20px;
            align-items: center;
        }

        h3 {
            text-align: center;
        }

        .submitBtn {
            font-size: 14px;
            padding: 3px 8px;
        }

        .timer {
            font-size: 20px;
            font-weight: bold;
            font-family: 'Arial', 'Helvetica', sans-serif;
            gap: 10px;
        }
    </style>
</head>

<body>
    <h3>스도쿠 게임</h3>
    <hr>
    <div class="sentence1">
        <b><em>Level 3, 문제 3번 풀이중...</em></b>
    </div>
    <div class="sentence2">
        <button id="submit" class="submitBtn">제출</button>
        <div class="timer"></div>
    </div>
    <div class="chart">
    </div>
    <script src="script_Lv3.js"></script>
